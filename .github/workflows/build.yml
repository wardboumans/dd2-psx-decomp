name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Static C runtime and static SDL3: dd2.exe runs without any DLLs or redistributables.
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/dd2 | Out-Null
          Copy-Item build/Release/dd2.exe, README.md, docs/CONTROLS.md, tools/make_assets.py dist/dd2/
          Compress-Archive dist/dd2/* dd2-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dd2-windows-x64
          path: dd2-windows-x64.zip

      # Every push to main replaces the "latest" pre-release, so there is always a download without signing in.
      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dd2-windows-x64.zip --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Built from $GITHUB_SHA. You need your own disc image; see README.md."

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dd2-windows-x64.zip --generate-notes
